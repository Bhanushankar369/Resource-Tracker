# The machine also has JDK 21 (Android Studio 2026.1.4's JBR, at
# "C:\Program Files\Android\Android Studio\jbr") and JDK 11 (JAVA_HOME). JDK 21
# cannot be used: Gradle only gained JDK 21 support in 8.5, and the wrapper here is
# 8.0.2. JDK 11 is below AGP 8.1's minimum.
#
# The path below is the JBR bundled with Android Studio Electric Eel 2022.3.1,
# the IDE that can actually run AGP 8.1.0. It is 17.0.6.
#
# This path is machine specific - do NOT commit it on a shared machine.
# Android Studio users can simply delete this line; Studio supplies the JBR.
# ---------------------------------------------------------------------------
org.gradle.java.home=C:\\Users\\bhanu\\AppData\\Local\\Android\\android-studio\\jbr

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
