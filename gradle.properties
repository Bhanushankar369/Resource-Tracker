# 4 GiB heap + 1 GiB metaspace on a 7 GiB machine causes native OOM (G1 mmap) crashes
# once Studio, the Kotlin daemon and adb are also resident. 2 GiB is enough for
# this project's single-module build and leaves headroom for the rest of the stack.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# AGP 8.1 has no usable configuration-cache support (it needs 8.2+ to be reliable,
# and Kotlin 2.0.21's plugin adds its own invalidation problems on top). Leaving this
# on is the most common cause of a sync that "succeeds" against a stale model.
# Re-enable it if/when AGP is upgraded past 8.5.
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false
android.nonFinalResIds=true

# AGP 8.1.0 was *tested* up to compileSdk 33, so it prints an advisory for 34.
# It is not a real incompatibility - compileSdk 34 builds and packages fine
# (verified: :app:assembleDebug succeeds). Dropping to 33 would cascade into
# Compose 1.6 / lifecycle 2.7 / core-ktx 1.12, all of which are far older than
# what this app actually needs. Remove this line together with the AGP downgrade.
android.suppressUnsupportedCompileSdk=34

kotlin.code.style=official

# ---------------------------------------------------------------------------
