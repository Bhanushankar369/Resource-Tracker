distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# 8.0, not 8.11.1: AGP 8.1.0 requires Gradle 8.0+, and Gradle only gained JDK 21
# support in 8.5 - so the downgrade past 8.11 was forced, not cosmetic.
# 8.0 is also the version Android Studio Electric Eel 2022.3.1 bundles, and it is
# already in the local wrapper cache, so this needs no download.
distributionUrl=https\://services.gradle.org/distributions/gradle-8.0-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
